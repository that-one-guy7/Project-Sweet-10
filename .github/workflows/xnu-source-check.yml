name: Verify pinned XNU and PongoOS sources

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "xnu/BASELINE.lock.json"
      - "xnu/history/**"
      - "tools/verify_xnu_source.py"
      - "tools/audit_xnu_machine_history.py"
      - "tools/inspect_launchd_jobs.py"
      - "tools/inspect_embedded_services.py"
      - "tools/compare_embedded_services.py"
      - "tools/crosscheck_embedded_services_launchd.py"
      - "pongo/BASELINE.lock.json"
      - "tools/verify_pongo_source.py"
      - "tests/**"
      - ".github/workflows/xnu-source-check.yml"
  push:
    branches: [main]
    paths:
      - "xnu/BASELINE.lock.json"
      - "xnu/history/**"
      - "tools/verify_xnu_source.py"
      - "tools/audit_xnu_machine_history.py"
      - "tools/inspect_launchd_jobs.py"
      - "tools/inspect_embedded_services.py"
      - "tools/compare_embedded_services.py"
      - "tools/crosscheck_embedded_services_launchd.py"
      - "pongo/BASELINE.lock.json"
      - "tools/verify_pongo_source.py"
      - "tests/**"
      - ".github/workflows/xnu-source-check.yml"

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Project Sweet-10
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned XNU commit from source lock
        id: source-lock
        run: |
          python3 -c 'import json; print("commit_sha=" + json.load(open("xnu/BASELINE.lock.json", encoding="utf-8"))["commit_sha"])' >> "$GITHUB_OUTPUT"
      - name: Read pinned historical XNU 7195 commit
        id: historical-xnu-lock
        run: |
          python3 -c 'import json; print("commit_sha=" + json.load(open("xnu/history/xnu-7195.121.3.lock.json", encoding="utf-8"))["commit_sha"])' >> "$GITHUB_OUTPUT"
      - name: Read pinned transition XNU 8019 commit
        id: transition-xnu-lock
        run: |
          python3 -c 'import json; print("commit_sha=" + json.load(open("xnu/history/xnu-8019.80.24.lock.json", encoding="utf-8"))["commit_sha"])' >> "$GITHUB_OUTPUT"
      - name: Read pinned PongoOS commit from source lock
        id: pongo-source-lock
        run: |
          python3 -c 'import json; print("commit_sha=" + json.load(open("pongo/BASELINE.lock.json", encoding="utf-8"))["commit_sha"])' >> "$GITHUB_OUTPUT"
      - name: Run host-side project tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check out pinned Apple XNU source
        uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/xnu
          ref: ${{ steps.source-lock.outputs.commit_sha }}
          path: xnu/upstream
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /makedefs/MakeInc.def
            /makedefs/MakeInc.kernel
            /pexpert/pexpert/arm64/board_config.h
            /pexpert/pexpert/arm64/H9.h

      - name: Verify exact source revision
        run: python3 tools/verify_xnu_source.py xnu/upstream
      - name: Check out historical XNU 7195 source
        uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/xnu
          ref: ${{ steps.historical-xnu-lock.outputs.commit_sha }}
          path: xnu/historical-7195
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /makedefs/MakeInc.def
            /makedefs/MakeInc.kernel
            /pexpert/pexpert/arm64/board_config.h
            /pexpert/pexpert/arm64/H9.h

      - name: Verify historical XNU source revision
        run: python3 tools/verify_xnu_source.py xnu/historical-7195 xnu/history/xnu-7195.121.3.lock.json
      - name: Check out transition XNU 8019 source
        uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/xnu
          ref: ${{ steps.transition-xnu-lock.outputs.commit_sha }}
          path: xnu/transition-8019
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /makedefs/MakeInc.def
            /makedefs/MakeInc.kernel
            /pexpert/pexpert/arm64/board_config.h
            /pexpert/pexpert/arm64/H9.h

      - name: Verify transition XNU source revision
        run: python3 tools/verify_xnu_source.py xnu/transition-8019 xnu/history/xnu-8019.80.24.lock.json
      - name: Audit historical T8010 machine-profile transition
        run: |
          python3 tools/audit_xnu_machine_history.py \
            xnu/historical-7195 xnu/transition-8019 xnu/upstream
      - name: Check out pinned PongoOS source
        uses: actions/checkout@v4
        with:
          repository: checkra1n/PongoOS
          ref: ${{ steps.pongo-source-lock.outputs.commit_sha }}
          path: pongo/upstream
          persist-credentials: false
      - name: Verify exact PongoOS source revision
        run: python3 tools/verify_pongo_source.py pongo/upstream
