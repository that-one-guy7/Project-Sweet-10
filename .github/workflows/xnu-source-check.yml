name: Verify pinned XNU source

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "xnu/BASELINE.lock.json"
      - "tools/verify_xnu_source.py"
      - "pongo/BASELINE.lock.json"
      - "tools/verify_pongo_source.py"
      - "tests/**"
      - ".github/workflows/xnu-source-check.yml"
  push:
    branches: [main]
    paths:
      - "xnu/BASELINE.lock.json"
      - "tools/verify_xnu_source.py"
      - "tests/**"
      - ".github/workflows/xnu-source-check.yml"

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Project Sweet-10
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned XNU commit from source lock
        id: source-lock
        run: |
          python3 -c 'import json; print("commit_sha=" + json.load(open("xnu/BASELINE.lock.json", encoding="utf-8"))["commit_sha"])' >> "$GITHUB_OUTPUT"
      - name: Read pinned PongoOS commit from source lock
        id: pongo-source-lock
        run: |
          python3 -c 'import json; print("commit_sha=" + json.load(open("pongo/BASELINE.lock.json", encoding="utf-8"))["commit_sha"])' >> "$GITHUB_OUTPUT"
      - name: Run host-side project tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check out pinned Apple XNU source
        uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/xnu
          ref: ${{ steps.source-lock.outputs.commit_sha }}
          path: xnu/upstream
          persist-credentials: false
      - name: Verify exact source revision
        run: python3 tools/verify_xnu_source.py xnu/upstream
      - name: Check out pinned PongoOS source
        uses: actions/checkout@v4
        with:
          repository: checkra1n/PongoOS
          ref: ${{ steps.pongo-source-lock.outputs.commit_sha }}
          path: pongo/upstream
          persist-credentials: false
      - name: Verify exact PongoOS source revision
        run: python3 tools/verify_pongo_source.py pongo/upstream
