name: Dyld export log comparator tests

on:
  pull_request:
    paths:
      - "tools/compare_dyld_exports.py"
      - "tools/compare_dyld_imports.py"
      - "tools/collect_agx_provider_exports.sh"
      - "tools/collect_libsystem_load_commands.sh"
      - "tools/collect_libsystem_reexport_exports.sh"
      - "tools/compare_dyld_reexports.py"
      - "tests/test_compare_dyld_exports.py"
      - "tests/test_compare_dyld_imports.py"
      - "tests/test_compare_dyld_reexports.py"
      - ".github/workflows/dyld-export-compare-tests.yml"
  push:
    branches:
      - main
    paths:
      - "tools/compare_dyld_exports.py"
      - "tools/compare_dyld_imports.py"
      - "tools/collect_agx_provider_exports.sh"
      - "tools/collect_libsystem_load_commands.sh"
      - "tools/collect_libsystem_reexport_exports.sh"
      - "tools/compare_dyld_reexports.py"
      - "tests/test_compare_dyld_exports.py"
      - "tests/test_compare_dyld_imports.py"
      - "tests/test_compare_dyld_reexports.py"
      - ".github/workflows/dyld-export-compare-tests.yml"

permissions:
  contents: read

jobs:
  compare-dyld-exports:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run host-side synthetic tests
        run: python3 -m unittest discover -s tests -v

      - name: Check export comparator CLI
        run: python3 tools/compare_dyld_exports.py --help

      - name: Check import comparator CLI
        run: python3 tools/compare_dyld_imports.py --help

      - name: Check re-export comparator CLI
        run: python3 tools/compare_dyld_reexports.py --help

      - name: Check provider collector shell syntax
        run: bash -n tools/collect_agx_provider_exports.sh

      - name: Check libSystem metadata collector shell syntax
        run: bash -n tools/collect_libsystem_load_commands.sh

      - name: Check libSystem re-export collector shell syntax
        run: bash -n tools/collect_libsystem_reexport_exports.sh
